  </text>

  <text x="100" y="68" fill="#D5D9DE" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="500" letter-spacing="1.5">
    CHAIRMAN — PAKISTAN LAWYER'S COMPANY
  </text>

  <line x1="90" y1="14" x2="90" y2="72" stroke="#26394B" stroke-width="1.2"/>
</svg>
