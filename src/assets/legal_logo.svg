    <path d="M52 40C52 45 68 45 68 40H52Z" fill="#26394B" stroke="#D5D9DE" stroke-width="1.6"/>
  </g>

  <!-- Typography Brand Lockup -->
  <text x="100" y="24" fill="#A8B4C0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="3.5">
    ADVOCATE HIGH COURT · SIALKOT
  </text>

  <text x="100" y="48" fill="#F3F0E9" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="17" font-weight="700" letter-spacing="1.2">
