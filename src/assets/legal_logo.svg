<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" fill="none">
  <!-- Crest Emblem (No Background) -->
  <g transform="translate(10, 5)">
    <!-- Central Scales of Justice Pillar -->
    <path d="M40 12V64" stroke="#D5D9DE" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M26 64H54" stroke="#D5D9DE" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M30 68H50" stroke="#A8B4C0" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="40" cy="13" r="3.2" fill="#D5D9DE"/>
    
    <!-- Cross Beam -->
    <path d="M18 24C28 20 52 20 62 24" stroke="#D5D9DE" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Left Scale Pan -->
